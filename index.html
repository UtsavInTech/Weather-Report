<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- Light overlay for theme glow -->
    <div id="light" class="light-overlay"></div>

    <!-- Floating clouds background -->
    <div class="cloud-layer">
        <span class="cloud c1"></span>
        <span class="cloud c2"></span>
        <span class="cloud c3"></span>
    </div>

    <!-- ════ APP ════ -->
    <div class="app">
        <div id="card" class="card">

            <h1 class="app-title">☁️ Weather</h1>

            <!-- Search -->
            <div class="search">
                <input id="cityInput" type="text" placeholder="Search city…" autocomplete="off" />
                <button id="searchBtn" aria-label="Search">🔍</button>
            </div>

            <!-- Error -->
            <div id="errorMsg" class="error-msg"></div>

            <!-- Loading -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <div class="loading-text">Fetching weather…</div>
            </div>

            <!-- Placeholder (before any search) -->
            <div id="placeholder" class="placeholder">
                <div class="placeholder-icon">🌤️</div>
                <p>Search for a city or allow<br/>location access to get started</p>
            </div>

            <!-- Weather Display -->
            <div id="weather" class="weather">
                <div id="weatherIcon" class="weather-icon"></div>
                <h2 id="cityName" class="city-name"></h2>
                <div id="temperature" class="temperature"></div>
                <div id="condition" class="condition"></div>

                <!-- Stat Cards -->
                <div class="stats">
                    <div id="humidity" class="stat-card">
                        <div class="stat-icon">💧</div>
                        <div class="stat-label">Humidity</div>
                        <div class="stat-value">—</div>
                    </div>
                    <div id="wind" class="stat-card">
                        <div class="stat-icon">🌬️</div>
                        <div class="stat-label">Wind</div>
                        <div class="stat-value">—</div>
                    </div>
                </div>
            </div>

            <!-- 5-Day Forecast -->
            <div id="forecastSection" class="forecast-section">
                <div class="forecast-title">5-Day Forecast</div>
                <div id="forecastRow" class="forecast-row"></div>
            </div>

        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
